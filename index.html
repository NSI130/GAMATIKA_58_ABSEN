<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Absensi Manual Pramuka 58</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-28">

  <!-- Header -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-base leading-tight">Absensi Pramuka 58 • Manual</h1>
        <p class="text-xs text-emerald-100" id="statusKoneksi">Memuat data DB...</p>
      </div>
      <button onclick="muatDataAwal(true)" class="text-xs bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded-lg font-medium transition">
        Refresh DB
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 pt-4 space-y-4">

    <!-- Step 1: Pilih Jadwal -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">1. Pilih Jadwal Absensi</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Bulan</label>
          <select id="selectBulan" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-emerald-600"></select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Minggu ke-</label>
          <select id="selectMinggu" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:border-emerald-600"></select>
        </div>
      </div>
      <div class="flex items-center justify-between mt-3 pt-3 border-t border-slate-100 text-xs">
        <span class="text-slate-500" id="infoPesertaAktif">Memuat peserta...</span>
        <button onclick="setSemuaStatus('H')" class="text-emerald-700 font-semibold hover:underline">Semua Hadir (H)</button>
      </div>
    </section>

    <!-- Step 2: List Peserta & Input Anggota Baru -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">2. Daftar Absensi Peserta</h2>
        <span class="text-xs font-bold text-slate-600" id="totalPesertaLabel">0 peserta</span>
      </div>

      <!-- Form Tambah Nama Baru -->
      <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
        <span class="text-xs font-bold text-slate-700 block">+ Tambah Anggota Baru</span>
        <div class="flex gap-2">
          <input type="text" id="inputNamaBaru" placeholder="Nama Lengkap" class="flex-1 border border-slate-300 rounded-lg px-3 py-1.5 text-xs bg-white focus:outline-none focus:border-emerald-600" />
          <select id="inputKelasBaru" class="w-24 border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white focus:outline-none focus:border-emerald-600">
            <option value="X-A">X-A</option>
            <option value="X-B">X-B</option>
            <option value="XI-A">XI-A</option>
            <option value="XI-B">XI-B</option>
            <option value="XII">XII</option>
          </select>
          <button onclick="tambahPesertaBaru()" class="bg-slate-900 text-white text-xs font-bold px-3.5 py-1.5 rounded-lg shrink-0">
            Tambah
          </button>
        </div>
      </div>

      <!-- List Data Peserta -->
      <div id="listAbsensi" class="divide-y divide-slate-100"></div>
    </section>

  </main>

  <!-- Floating Bottom Action Bar -->
  <div class="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 p-3 shadow-lg z-30">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
      <div class="text-xs text-slate-600 leading-tight">
        Target: <strong id="labelTargetKirim" class="text-slate-900">-</strong>
        <div class="text-[11px] font-semibold text-emerald-700" id="labelStatusBawah">Pilih status lalu kirim</div>
      </div>
      <button id="btnKirim" onclick="kirimKeSpreadsheet()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm px-5 py-2.5 rounded-xl shadow transition shrink-0">
        Kirim ke Sheets →
      </button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-16 inset-x-4 max-w-md mx-auto bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-xl hidden z-50 text-center"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxHFjrh4q4VSUwA0s03OyRFfel8s78e0hP4YbzY-AQSCLiU_tcMepdrxhysEj6R4-ZWnw/exec';
    const API_TOKEN = 'PRAMUKA_58_SECRET_2026';
    const CACHE_DB_KEY = 'pramuka58_db_manual_v1';

    let rawJadwal = [];
    let rawPeserta = [];
    let absensiData = []; // Menyimpan status [{ rowIndex, nama, kelas, status, isNew }]

    window.addEventListener('DOMContentLoaded', () => {
      muatDataAwal(false);
      document.getElementById('selectBulan').addEventListener('change', updateDropdownMinggu);
      document.getElementById('selectMinggu').addEventListener('change', buildListAbsensi);
    });

    function showToast(msg, duration = 3500) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.add('hidden'), duration);
    }

    async function muatDataAwal(forceRefresh = false) {
      const statusEl = document.getElementById('statusKoneksi');
      const cachedRaw = localStorage.getItem(CACHE_DB_KEY);

      if (cachedRaw && !forceRefresh) {
        try { terapkanDataKeUI(JSON.parse(cachedRaw), 'Cache'); } catch (e) {}
      } else {
        statusEl.textContent = 'Menyinkronkan ke Sheets...';
      }

      try {
        const res = await fetch(`${API_URL}?token=${encodeURIComponent(API_TOKEN)}`);
        const data = await res.json();
        if (data.status !== 'success') throw new Error(data.message || 'Gagal memuat DB.');

        localStorage.setItem(CACHE_DB_KEY, JSON.stringify(data));
        terapkanDataKeUI(data, 'Live Sync');
        if (forceRefresh) showToast('DB berhasil diperbarui!');
      } catch (err) {
        if (!cachedRaw) statusEl.textContent = 'Gagal terhubung ke Spreadsheet';
        showToast('Error DB: ' + err.message, 5000);
      }
    }

    function terapkanDataKeUI(data, sumberLabel) {
      rawJadwal = data.jadwal || [];
      rawPeserta = data.peserta || [];
      isiDropdownBulan();
      document.getElementById('statusKoneksi').textContent = `Terhubung: ${data.sheetName} (${sumberLabel})`;
    }

    function isiDropdownBulan() {
      const selectBulan = document.getElementById('selectBulan');
      const prev = selectBulan.value;
      const bulanUnik = [...new Set(rawJadwal.map(j => j.bulan))];
      selectBulan.innerHTML = bulanUnik.map(b => `<option value="${b}">${b}</option>`).join('');

      if (prev && bulanUnik.includes(prev)) selectBulan.value = prev;
      else if (bulanUnik.includes('November')) selectBulan.value = 'November';
      updateDropdownMinggu();
    }

    function updateDropdownMinggu() {
      const bulanTerpilih = document.getElementById('selectBulan').value;
      const selectMinggu = document.getElementById('selectMinggu');
      const prev = selectMinggu.value;
      const mingguList = rawJadwal.filter(j => j.bulan === bulanTerpilih);

      selectMinggu.innerHTML = mingguList
        .map(m => `<option value="${m.minggu}" data-col="${m.colIndex}">Minggu ke-${m.minggu} (Kolom ${m.colLetter})</option>`)
        .join('');

      if (prev && mingguList.some(m => String(m.minggu) === prev)) selectMinggu.value = prev;
      buildListAbsensi();
    }

    function buildListAbsensi() {
      const bulan = document.getElementById('selectBulan').value;
      const selectMinggu = document.getElementById('selectMinggu');
      const minggu = Number(selectMinggu.value);
      const opt = selectMinggu.options[selectMinggu.selectedIndex];
      const colIndex = opt ? Number(opt.dataset.col) : null;

      document.getElementById('labelTargetKirim').textContent = `${bulan} - M${minggu}`;

      // Ambil peserta aktif (bukan purna untuk kolom ini)
      const dbAktif = rawPeserta.filter(p => !p.purnaCols.includes(colIndex));
      
      document.getElementById('infoPesertaAktif').textContent = `Total peserta aktif: ${dbAktif.length}`;

      // Mapping ke state lokal (pertahankan status jika sudah diubah sebelumnya)
      const existingMap = new Map(absensiData.map(item => [item.rowIndex || item.nama, item.status]));

      absensiData = dbAktif.map(p => ({
        rowIndex: p.rowIndex,
        nama: p.nama,
        kelas: p.kelas,
        status: existingMap.get(p.rowIndex) || 'H', // Default Hadir
        isNew: false
      }));

      // Masukkan juga peserta baru yang ditambahkan manual di sesi ini
      const pesertaBaruSesiIni = absensiData.filter(item => item.isNew);
      absensiData = [...absensiData.filter(item => !item.isNew), ...pesertaBaruSesiIni];

      renderList();
    }

    function renderList() {
      const container = document.getElementById('listAbsensi');
      document.getElementById('totalPesertaLabel').textContent = `${absensiData.length} peserta`;

      if (absensiData.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Belum ada data peserta.</p>`;
        return;
      }

      container.innerHTML = absensiData.map((item, idx) => {
        const st = item.status;
        const btnClass = (kode, activeColor) =>
          st === kode ? `${activeColor} text-white font-bold shadow-xs` : `bg-slate-100 text-slate-600 hover:bg-slate-200`;

        const badgeBaru = item.isNew ? `<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold ml-1">Baru</span>` : '';

        return `
          <div class="py-2.5 flex items-center justify-between gap-2">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5">
                <p class="text-xs sm:text-sm font-bold text-slate-800 truncate">
                  <span class="text-slate-400 font-mono mr-1">${idx + 1}.</span>${item.nama}
                </p>
                ${badgeBaru}
              </div>
              <p class="text-[11px] text-slate-500">${item.kelas}</p>
            </div>

            <div class="flex gap-1 shrink-0">
              <button onclick="ubahStatus(${idx}, 'H')" class="w-8 h-8 rounded-lg text-xs transition ${btnClass('H', 'bg-emerald-600')}">H</button>
              <button onclick="ubahStatus(${idx}, 'S')" class="w-8 h-8 rounded-lg text-xs transition ${btnClass('S', 'bg-cyan-600')}">S</button>
              <button onclick="ubahStatus(${idx}, 'I')" class="w-8 h-8 rounded-lg text-xs transition ${btnClass('I', 'bg-purple-600')}">I</button>
              <button onclick="ubahStatus(${idx}, 'A')" class="w-8 h-8 rounded-lg text-xs transition ${btnClass('A', 'bg-red-600')}">A</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function ubahStatus(idx, kode) {
      absensiData[idx].status = kode;
      renderList();
    }

    function setSemuaStatus(kode) {
      absensiData.forEach(item => item.status = kode);
      renderList();
      showToast(`Semua status diubah menjadi ${kode}`);
    }

    function tambahPesertaBaru() {
      const namaInput = document.getElementById('inputNamaBaru');
      const kelasInput = document.getElementById('inputKelasBaru');
      const nama = namaInput.value.trim();
      const kelas = kelasInput.value;

      if (!nama) {
        showToast('Masukkan nama peserta terlebih dahulu!');
        return;
      }

      absensiData.push({
        rowIndex: null,
        nama: nama,
        kelas: kelas,
        status: 'H',
        isNew: true
      });

      namaInput.value = '';
      renderList();
      showToast(`Berhasil menambahkan ${nama} ke daftar.`);
    }

    async function kirimKeSpreadsheet() {
      const bulan = document.getElementById('selectBulan').value;
      const minggu = Number(document.getElementById('selectMinggu').value);

      const absensiExisting = absensiData
        .filter(r => !r.isNew && r.rowIndex !== null)
        .map(r => ({ rowIndex: r.rowIndex, nama: r.nama, status: r.status }));

      const pesertaBaru = absensiData
        .filter(r => r.isNew && r.nama.trim() !== '')
        .map(r => ({ nama: r.nama.trim(), kelas: r.kelas, status: r.status }));

      const payload = {
        token: API_TOKEN,
        bulan: bulan,
        minggu: minggu,
        absensi: absensiExisting,
        pesertaBaru: pesertaBaru
      };

      const btn = document.getElementById('btnKirim');
      btn.disabled = true;
      btn.textContent = 'Mengirim...';

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === 'success') {
          showToast(result.message, 5000);
          if (result.added > 0) await muatDataAwal(true);
        } else {
          throw new Error(result.message || 'Gagal menyimpan data.');
        }
      } catch (err) {
        showToast('Gagal kirim: ' + err.message, 5000);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kirim ke Sheets →';
      }
    }
  </script>
</body>
</html>
